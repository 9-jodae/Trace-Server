  #     NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
  #     INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required}
  #     SPRING_BASE_URL: http://app:8080
  #     AWS_REGION: ${AWS_REGION:-ap-southeast-1}
  #   ports:
  #     - "127.0.0.1:8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     neo4j:
  #       condition: service_healthy
  #   restart: unless-stopped
volumes:
  postgres-data:
  neo4j-data:
