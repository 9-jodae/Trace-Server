services:
  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/docs199
      DB_USER: docs199
      STORAGE_TYPE: s3
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AI_MODE: mock
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  health-gateway:
    image: nginx:1.30.6-alpine
    volumes:
      - ./infra/nginx/health.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: docs199
      POSTGRES_USER: docs199
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs199 -d docs199"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  neo4j:
    image: neo4j:2026.10.1-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      # Any NEO4J_-prefixed env var is treated by the image's entrypoint as a neo4j.conf setting
      # override, so the healthcheck password is passed under a differently-prefixed name.
      HEALTHCHECK_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      # Community edition default memory settings target large standalone hosts. This server is
      # shared with the Spring app, PostgreSQL, and (soon) the AI server, so the graph store is
      # capped well below the host's available memory. See docs/deployment.md for the budget.
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$HEALTHCHECK_NEO4J_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  # AI server: uncomment once its image is published and the ingest/query contract (Issue #14) is confirmed.
  # ai:
  #   build:
  #     context: ../docs199-AI
