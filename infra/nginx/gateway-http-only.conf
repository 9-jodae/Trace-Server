map $server_port $forwarded_proto {
    default $scheme;
}

map $server_port $forwarded_for {
    default $remote_addr;
}

map $server_port $forwarded_port {
    default $server_port;
}

server {
    listen 8080;
    server_tokens off;

    # Docker's embedded DNS re-resolves the app service after container replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $app_upstream app;

    client_max_body_size 150m;

    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass http://$app_upstream:8080/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Proto-Ssl "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    location ^~ /api/dev/ {
        return 404;
    }

    location ^~ /actuator {
        return 404;
    }

    location ^~ /swagger-ui {
        return 404;
    }

    location ^~ /v3/api-docs {
        return 404;
    }

    location /api/ {
        # No URI suffix: preserve the original request URI when proxying with a variable.
        proxy_pass http://$app_upstream:8080;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Proto-Ssl "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location / {
        return 404;
    }
}
