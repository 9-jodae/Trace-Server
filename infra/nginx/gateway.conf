map $server_port $forwarded_proto {
    8080 $scheme;
    8081 https;
}

map $server_port $forwarded_for {
    8080 $remote_addr;
    8081 $http_x_forwarded_for;
}

map $server_port $forwarded_port {
    8080 $server_port;
    8081 443;
}

server {
    listen 8080;
    listen 8081;
    server_tokens off;

    # Docker's embedded DNS re-resolves the app service after container replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $app_upstream app;

    # Spring's MAX_UPLOAD_REQUEST_SIZE defaults to 100MB; keep this above that
    # default with headroom. Raise it if MAX_UPLOAD_REQUEST_SIZE is raised.
    client_max_body_size 150m;

    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass http://$app_upstream:8080/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Proto-Ssl "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # Internal-only surfaces: never reachable from outside the gateway, even
    # though some are already permitAll()/disabled in Spring's prod profile.
    location ^~ /api/internal/ {
        return 404;
    }

    location ^~ /api/dev/ {
        return 404;
    }

    location ^~ /actuator {
        return 404;
    }

    location ^~ /swagger-ui {
        return 404;
    }

    location ^~ /v3/api-docs {
        return 404;
    }

    location /api/ {
        # No URI suffix: preserve the original request URI when proxying with a variable.
        proxy_pass http://$app_upstream:8080;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Forwarded-Proto-Ssl "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location / {
        return 404;
    }
}
