server {
    listen 8080;
    server_tokens off;

    # Spring's MAX_UPLOAD_REQUEST_SIZE defaults to 100MB; keep this above that
    # default with headroom. Raise it if MAX_UPLOAD_REQUEST_SIZE is raised.
    client_max_body_size 150m;

    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass http://app:8080/api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # Internal-only surfaces: never reachable from outside the gateway, even
    # though some are already permitAll()/disabled in Spring's prod profile.
    location ^~ /api/internal/ {
        return 404;
    }

    location ^~ /api/dev/ {
        return 404;
    }

    location ^~ /actuator {
        return 404;
    }

    location ^~ /swagger-ui {
        return 404;
    }

    location ^~ /v3/api-docs {
        return 404;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location / {
        return 404;
    }
}
