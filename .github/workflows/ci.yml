name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - run: docker compose build minio
      - run: docker pull pgvector/pgvector:0.8.7-pg18
      - run: python -m pip install -r demo/tools/requirements.txt
      - run: python scripts/tests/test_eval_evidence.py
      - run: ./gradlew ktlintCheck test build
